<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Dark — AI-native systems, data infrastructure, and product engineering</title>
  <desc id="desc">A dark blue technical banner with a glowing systems diagram and a concise personal positioning statement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#93c5fd" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="1110" cy="190" rx="360" ry="280" fill="url(#glow)"/>
  <path d="M0 359 C310 304 480 432 788 351 S1180 282 1440 338" fill="none" stroke="url(#accent)" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M0 381 C290 323 514 448 802 374 S1182 310 1440 363" fill="none" stroke="#a78bfa" stroke-opacity="0.09"/>

  <g transform="translate(104,78)">
    <rect x="0" y="0" width="52" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="84" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="750" letter-spacing="-2">DARK</text>
    <text x="2" y="130" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="2">@DARKMICE</text>
    <text x="0" y="205" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="600">AI-native systems · Data infrastructure</text>
    <text x="0" y="244" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="600">Product engineering · Verified delivery</text>
    <text x="0" y="294" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">DESIGN → BUILD → CHALLENGE → VERIFY</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="1220,92 1324,152 1324,272 1220,332 1116,272 1116,152" stroke="#60a5fa" stroke-opacity="0.30" stroke-width="1.5"/>
    <polygon points="1220,130 1288,170 1288,250 1220,290 1152,250 1152,170" stroke="#22d3ee" stroke-opacity="0.48" stroke-width="1.5"/>
    <polygon points="1220,171 1255,191 1255,231 1220,251 1185,231 1185,191" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M1220 171V130 M1255 191L1288 170 M1255 231L1288 250 M1220 251V290 M1185 231L1152 250 M1185 191L1152 170" stroke="#7dd3fc" stroke-opacity="0.70" stroke-width="1.5"/>
    <circle cx="1220" cy="211" r="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1220" cy="130" r="5" fill="#60a5fa" stroke="none"/>
    <circle cx="1288" cy="170" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="1288" cy="250" r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="1220" cy="290" r="5" fill="#60a5fa" stroke="none"/>
    <circle cx="1152" cy="250" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="1152" cy="170" r="5" fill="#a78bfa" stroke="none"/>
  </g>

  <rect x="1" y="1" width="1438" height="418" rx="27" fill="none" stroke="#93c5fd" stroke-opacity="0.12" stroke-width="2"/>
</svg>
